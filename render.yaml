# Render Blueprint — Mundo-3D backend (free-tier web service).
# Cardless free-tier topology: Cloudflare Pages (frontend + /api/* proxy) +
# Render Free (backend) + TiDB Cloud Starter (DB) + Brevo (HTTPS/SMTP) +
# Supabase Storage S3 / R2 / Cloudinary (STORAGE_DRIVER).
# See docs/RUNBOOKS.md "Platform bring-up".
#
# Secrets are declared here as keys with `sync: false` so the manifest is a
# complete, reviewable inventory of what production needs while no secret
# value ever enters git — set each one in the Render dashboard.
services:
  - type: web
    name: mundo-3d-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # Keep devDependencies: `tsc`/`typescript` are devDependencies and
    # `RUN_COMPILED=true` needs the emitted dist/. Do not pass --prod here.
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter backend build
    # deploy:start (PR2) chains env-preflight && migrate-and-start: a missing
    # required env var fails fast before the app process is ever started, and
    # db:migrate runs before the new version serves traffic.
    startCommand: pnpm --filter backend deploy:start
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_COMPILED
        value: "true"
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        sync: false
      - key: COOKIE_SECRET
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_CA_CERT
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      # Optional when using the Cloudflare Pages same-origin /api/* proxy.
      - key: COOKIE_DOMAIN
        sync: false
      # Shared secret authenticating CF-Connecting-IP from the Pages proxy.
      - key: PROXY_SHARED_SECRET
        sync: false
      # Brevo — HTTPS API v3 on port 443 (`MAIL_DRIVER=brevo-http` +
      # `BREVO_API_KEY` + `MAIL_FROM`) works on Render Free, which blocks
      # outbound SMTP port 587. Keep `SMTP_*` for hosts allowing port 587.
      - key: MAIL_DRIVER
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Object storage driver: selects `r2`, `cloudinary`, or `disabled`.
      - key: STORAGE_DRIVER
        sync: false
      # Cloudinary Free — used when STORAGE_DRIVER=cloudinary.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # S3-compatible object storage — used when STORAGE_DRIVER=r2.
      # Supports Cloudflare R2 and Supabase Storage S3 (`R2_REGION` +
      # `R2_FORCE_PATH_STYLE=true`). See docs/RUNBOOKS.md "Platform bring-up".
      - key: R2_ENDPOINT
        sync: false
      - key: R2_REGION
        sync: false
      - key: R2_FORCE_PATH_STYLE
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL_BASE
        sync: false
      # Demo Sandbox — opt-in ephemeral isolated slots (disabled by default).
      # Keep DEMO_SANDBOX_ENABLED="false" until slots are bootstrapped via
      # `pnpm --filter backend db:sandbox:bootstrap`.
      - key: DEMO_SANDBOX_ENABLED
        value: "false"
      - key: DEMO_SANDBOX_RECOVER_ON_BOOT
        value: "false"
      - key: DEMO_SANDBOX_JWT_SECRET
        sync: false
      - key: DEMO_SANDBOX_SLOTS_JSON
        sync: false
      - key: DEMO_SANDBOX_DB_HOST
        sync: false
      - key: DEMO_SANDBOX_DB_PORT
        sync: false
      - key: DEMO_SANDBOX_DB_CA_CERT
        sync: false
