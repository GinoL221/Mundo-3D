packages:
  - 'backend'
  - 'frontend'
  - 'e2e'


# Security Hardening (npm/pnpm Security Hardening — Protocolo 2026)
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.20.0

# 2026-09-02 — deliberate exception to the minimumReleaseAge above, granted by
# the maintainer. `qs` 6.15.2 carries two MODERATE advisories that reach
# PRODUCTION through express > body-parser: an array-limit bypass via
# bracket-key comma parsing, and a DoS via attacker-controlled `isBuffer`.
# Clearing both needs 6.16.0, and 6.15.4 clears only the first.
#
# 6.16.0 was published 2026-08-29 — under the 7-day floor at the time this was
# added. The floor exists to blunt supply-chain attacks on freshly published
# versions, so overriding it is a real cost, taken here because these two are
# live in production rather than dev-tree noise.
#
# This entry can be REMOVED once 6.16.0 is comfortably past 7 days (from
# 2026-09-05 onward): the override below then satisfies the policy on its own.
minimumReleaseAgeExclude:
  - qs@6.16.0
strictDepBuilds: true
blockExoticSubdeps: true

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Steer @astrojs/check's transitive chokidar@^4.0.3 to the already-trusted
# 3.6.0 already used elsewhere in this lockfile, instead of weakening
# trustPolicy — chokidar@4.0.3 lost provenance attestation (possible
# takeover) and is blocked by the no-downgrade policy above.
#
# express-rate-limit@8.6.2 still declares `ip-address: ^10.2.0`, and pnpm
# does not auto-bump a transitive-only dependency to the range's latest on
# install/update. 10.2.0 carries a HIGH advisory (leading-zero octets
# decoded as decimal); fixed in 10.3.1. This is the version keying the
# login/register rate limiters by client IP.
#
# 2026-09-01 audit-drift cleanup — same "declared range already allows the
# fix, pnpm just won't move there on its own" pattern as ip-address above:
# - sharp: astro's own optionalDependencies already say `^0.34.0 || ^0.35.0`;
#   0.34.5 carries 4 HIGH libvips CVEs, fixed at 0.35.0.
# - svgo: astro's own dependencies already say `^4.0.1`; 4.0.1 has a HIGH
#   (removeScripts leaves some executable scripts intact), fixed at 4.0.2.
# - uuid: sequelize pins `^8.3.2` (a major behind); the HIGH-severity buffer
#   check only affects v3/v5/v6 with a caller-supplied `buf`, and sequelize's
#   own source (lib/utils.js) only ever calls `.v1`/`.v4` — both stable CJS
#   named exports across uuid 8 through 11. Pinned to backend's own existing
#   direct uuid@11.1.1 so only one uuid version is installed.
# - body-parser: express@4.22.2 pins `~1.20.5` (patch-only range); 1.20.5 has
#   a LOW DoS (invalid `limit` silently disables size enforcement), fixed at
#   1.20.6, which already satisfies express's own tilde range.
# 2026-09-01 audit finding 6 — dev-tree advisories. Same "the declared range
# already allows the fix, pnpm just won't move there on its own" pattern as
# everything above, but these live in build tooling rather than shipped code,
# so none of them reached production and `pnpm audit --prod` was already
# clean. Clearing them anyway keeps a plain `pnpm audit` readable, so a real
# advisory is not lost in a wall of known-noise entries.
#
# All three brace-expansion majors are present at once (minimatch 3.x, 5.x
# and 10.x each request a different one), so they need one selector each
# rather than a single range that would force incompatible majors together:
# - brace-expansion: 3 DoS advisories (exponential expansion, unbounded
#   length, unbounded intermediate arrays), via jest and @eslint/js.
# - js-yaml: quadratic CPU on merge-key chains and on !!omap resolution.
#   4.3.1 was already in the tree; the override also dedupes 4.2.0 onto it.
# - fast-uri: host confusion via backslash authority, via swagger-jsdoc.
#
# 2026-09-01, second occurrence — the full-tree audit gate added in the same
# session caught these within hours of going live, which is the gate working
# as intended rather than a problem with it:
# - browserslist: 2 HIGH (unbounded memory growth with no cache eviction, and
#   an uncaught crash / prototype write via untrusted browserslist-stats.json),
#   reached through jest. 4.28.2 -> 4.28.7. jest's own declared range is
#   `>= 4.21.0`, so the fix was already permitted; pnpm just would not move a
#   transitive-only dependency there on its own.
overrides:
  chokidar: 3.6.0
  ip-address: ^10.3.1
  sharp: ^0.35.0
  svgo: ^4.0.2
  uuid: ^11.1.1
  body-parser: ^1.20.6
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  fast-uri: ^3.1.5
  browserslist: ^4.28.7
  # 2 MODERATE advisories reaching production via express > body-parser; see
  # the minimumReleaseAgeExclude note above for why this needed an exception.
  qs: ^6.16.0

# `astro check` dynamically `import()`s "typescript" from astro's own
# module scope, not the caller's cwd; astro declares no peerDependency on
# typescript, so pnpm's strict/isolated node_modules leaves it
# unresolvable even though typescript is a direct devDependency of every
# workspace project. Hoisting it to the root node_modules keeps `astro
# check` working. No effect on trustPolicy/audit/script-blocking hardening
# above.
publicHoistPattern:
  - typescript
