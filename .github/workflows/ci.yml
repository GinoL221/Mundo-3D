name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint, types, fast tests, coverage, Astro)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.0.9

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gates on the FULL tree, dev dependencies included. That scope only
      # became achievable once the dev tree was cleared (it carried 1
      # moderate and 14 high before "chore(deps): clear the 15 dev-tree
      # advisories"); this step was introduced as --prod for exactly that
      # reason. Deliberately the stricter scope now: a DoS advisory in build
      # tooling cannot reach a deployed artifact, but letting those pile up
      # is precisely how a real one gets lost in the noise.
      #
      # The cost is real and accepted. brace-expansion alone shipped three
      # advisories in July 2026, and any new one anywhere in the tree blocks
      # every PR until someone adds an override to pnpm-workspace.yaml —
      # which is how every entry in that file's overrides block got there.
      # This is the automated half of the "Security Hardening" policy that
      # lives beside those overrides, enforced only by hand until now.
      - name: Audit all dependencies
        run: bash .github/scripts/run-pnpm-audit.sh

      - name: Validate CI supply-chain controls
        run: node --test .github/scripts/run-pnpm-audit.test.js

      - name: Check architecture boundaries
        run: pnpm --filter backend architecture:check

      - name: Check OpenAPI spec is up to date
        run: pnpm run check:openapi

      - name: Run linter
        run: pnpm run lint

      - name: Run backend strict type-check
        run: pnpm run type-check

      - name: Run fast tests (DB-independent)
        run: pnpm run test:fast

      - name: Run standalone Node script unit tests (DB-independent)
        run: pnpm run test:deploy-scripts

      - name: Run backend coverage and generate risk map
        run: pnpm run test:coverage

      - name: Run frontend Astro check
        run: pnpm run frontend:check

      - name: Run frontend quality check (no console.log, 250-line cap)
        run: pnpm run frontend:quality-check

      - name: Build frontend
        run: pnpm run frontend:build
        env:
          # astro.config.mjs fails the build when this is unset (see
          # feat(frontend): fail the build when PUBLIC_API_URL is missing).
          # CI only validates the build, it never deploys this output, so a
          # placeholder is fine here — never the real production API URL.
          PUBLIC_API_URL: https://api.example.invalid

      - name: Upload coverage and risk-map evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-coverage
          path: |
            backend/coverage/lcov.info
            backend/coverage/coverage-summary.json
            backend/coverage/risk-map.json
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: Real-DB integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: >-
          mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.0.9

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migrations build schema on a fresh database
        run: |
          mysql -h 127.0.0.1 -u root \
            -e "CREATE DATABASE IF NOT EXISTS mundo_3d_migrate_ci;"
          pnpm --filter backend db:migrate
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: ''
          DB_NAME: mundo_3d_migrate_ci

      - name: Run backend real-DB integration tests
        timeout-minutes: 5
        run: pnpm run test:integration
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: ''

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: >-
          mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.0.9

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: pw
        run: |
          playwright_version="$(
            pnpm --filter e2e exec playwright --version |
              cut -d' ' -f2
          )"
          echo "v=$playwright_version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.v }}-pw1228

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Install Playwright System Dependencies (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter e2e exec playwright install-deps

      - name: Run E2E tests
        id: e2e-tests
        run: pnpm run test:e2e
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: ''
          CI_RETRY_EVIDENCE_MODE: failed

      - name: Summarize E2E result
        if: success()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const reportPath = 'e2e/test-results/results.json';
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const stack = [report];
          let recovered = false;
          while (stack.length) {
            const value = stack.pop();
            if (Array.isArray(value)) stack.push(...value);
            else if (value && typeof value === 'object') {
              if (value.retry > 0 && value.status === 'passed') {
                recovered = true;
              }
              stack.push(...Object.values(value));
            }
          }
          const message = recovered
            ? 'RECOVERED_PASS: one Playwright retry passed.'
            : 'E2E_PASS_FIRST_ATTEMPT';
          console.log(message);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${message}\n`);
          NODE

      - name: Summarize final E2E failure
        if: failure() && steps.e2e-tests.outcome == 'failure'
        run: |
          echo 'FINAL_E2E_FAILURE: single Playwright retry exhausted.' \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright failure diagnostics
        if: failure() && steps.e2e-tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-failure-diagnostics
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

  verification-gate:
    name: Verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, integration, e2e]
    if: always()

    steps:
      - name: Require every mandatory check to have succeeded
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "e2e: ${{ needs.e2e.result }}"
          if [ "${{ needs.quality.result }}" != "success" ] || \
             [ "${{ needs.integration.result }}" != "success" ] || \
             [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "One or more mandatory checks failed or could not run." \
              "Blocking integration." >&2
            exit 1
          fi
          echo "All mandatory checks succeeded."
